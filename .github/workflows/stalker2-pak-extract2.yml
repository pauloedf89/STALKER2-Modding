name: S.T.A.L.K.E.R. 2 - Extract Repository PAK

on:
  workflow_dispatch:
    inputs:
      pak_path:
        description: 'Repository path to the .pak file'
        required: true
        default: 'StalkerUnlimited_NC_50_P.pak'
        type: string

      include:
        description: 'Optional repak include glob. Example: **/CharacterWeaponSettingsPrototypes/**'
        required: false
        default: ''
        type: string

      use_aes_key:
        description: 'Use STALKER2_AES_KEY for encrypted PAKs'
        required: true
        default: false
        type: boolean

      output_folder:
        description: 'Folder name for extracted files'
        required: true
        default: 'StalkerUnlimited_NC_50_P_extracted'
        type: string

permissions:
  contents: read

jobs:
  extract-pak:
    name: Extract Unreal Engine .pak
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # VALIDATE PAK
      # ============================================================

      - name: Validate PAK
        run: |
          $ErrorActionPreference = 'Stop'

          $pak = '${{ inputs.pak_path }}'

          if (-not (Test-Path -LiteralPath $pak -PathType Leaf)) {
            throw "PAK file was not found in the repository: $pak"
          }

          $item = Get-Item -LiteralPath $pak

          if ($item.Extension -ne '.pak') {
            throw "The selected file is not a .pak file: $($item.FullName)"
          }

          Write-Host "PAK:  $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"

      # ============================================================
      # DOWNLOAD REPAK 0.2.3
      # ============================================================

      - name: Download repak v0.2.3
        run: |
          $ErrorActionPreference = 'Stop'

          $toolDir = Join-Path $env:RUNNER_TEMP 'repak'
          $zip = Join-Path $toolDir 'repak.zip'
          $binDir = Join-Path $toolDir 'bin'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $binDir | Out-Null

          $url = 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip'

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $binDir `
            -Force

          $repak = Get-ChildItem `
            -LiteralPath $binDir `
            -Filter 'repak.exe' `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $repak) {
            throw 'repak.exe was not found after extracting the release.'
          }

          "REPAK_EXE=$($repak.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "repak executable:"
          Write-Host $repak.FullName

          & $repak.FullName --version

          if ($LASTEXITCODE -ne 0) {
            throw "repak --version failed with exit code $LASTEXITCODE."
          }

      # ============================================================
      # PREPARE AES ARGUMENT
      # ============================================================

      - name: Prepare AES key
        env:
          STALKER2_AES_KEY: ${{ secrets.STALKER2_AES_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $useKey = '${{ inputs.use_aes_key }}'

          if ($useKey -eq 'true') {

            if ([string]::IsNullOrWhiteSpace($env:STALKER2_AES_KEY)) {
              throw 'use_aes_key is enabled, but STALKER2_AES_KEY is not configured.'
            }

            Write-Host 'AES key: configured'

            "REPAK_AES_ARGS=--aes-key `"$($env:STALKER2_AES_KEY)`"" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

          } else {

            Write-Host 'AES key: not used'

            "REPAK_AES_ARGS=" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append
          }

      # ============================================================
      # INSPECT PAK
      # ============================================================

      - name: Inspect PAK
        env:
          STALKER2_AES_KEY: ${{ secrets.STALKER2_AES_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $pak = '${{ inputs.pak_path }}'
          $useKey = '${{ inputs.use_aes_key }}'

          $logDir = Join-Path `
            $env:RUNNER_TEMP `
            'stalker2-pak-extract'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $logDir | Out-Null

          # --------------------------------------------------------
          # Build global repak arguments
          # --------------------------------------------------------

          $globalArgs = @()

          if ($useKey -eq 'true') {

            if ([string]::IsNullOrWhiteSpace($env:STALKER2_AES_KEY)) {
              throw 'AES key was requested but STALKER2_AES_KEY is empty.'
            }

            $globalArgs += '--aes-key'
            $globalArgs += $env:STALKER2_AES_KEY
          }

          # --------------------------------------------------------
          # INFO
          # --------------------------------------------------------

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PAK INFORMATION'
          Write-Host '========================================'

          & $env:REPAK_EXE @globalArgs info $pak 2>&1 |
            Tee-Object `
              -FilePath (Join-Path $logDir 'pak-info.txt')

          if ($LASTEXITCODE -ne 0) {
            throw "repak info failed with exit code $LASTEXITCODE."
          }

          # --------------------------------------------------------
          # LIST
          # --------------------------------------------------------

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'PAK FILE LIST'
          Write-Host '========================================'

          & $env:REPAK_EXE @globalArgs list $pak 2>&1 |
            Tee-Object `
              -FilePath (Join-Path $logDir 'pak-list.txt')

          if ($LASTEXITCODE -ne 0) {
            throw "repak list failed with exit code $LASTEXITCODE."
          }

      # ============================================================
      # PREPARE OUTPUT
      # ============================================================

      - name: Prepare extraction directory
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path `
            $env:RUNNER_TEMP `
            '${{ inputs.output_folder }}'

          if (Test-Path -LiteralPath $root) {
            Remove-Item `
              -LiteralPath $root `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $root | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path (Join-Path $root 'logs') | Out-Null

          "EXTRACT_OUTPUT=$root" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ============================================================
      # UNPACK
      # ============================================================

      - name: Unpack PAK
        env:
          STALKER2_AES_KEY: ${{ secrets.STALKER2_AES_KEY }}

        run: |
          $ErrorActionPreference = 'Stop'

          $pak = '${{ inputs.pak_path }}'
          $output = $env:EXTRACT_OUTPUT
          $include = '${{ inputs.include }}'
          $useKey = '${{ inputs.use_aes_key }}'

          # --------------------------------------------------------
          # Global arguments must come BEFORE "unpack"
          # --------------------------------------------------------

          $args = @()

          if ($useKey -eq 'true') {

            if ([string]::IsNullOrWhiteSpace($env:STALKER2_AES_KEY)) {
              throw `
                'AES key requested but STALKER2_AES_KEY is not configured.'
            }

            $args += '--aes-key'
            $args += $env:STALKER2_AES_KEY
          }

          # --------------------------------------------------------
          # Command
          # --------------------------------------------------------

          $args += 'unpack'
          $args += $pak

          # --------------------------------------------------------
          # Output
          # --------------------------------------------------------

          $args += '--output'
          $args += $output

          # --------------------------------------------------------
          # Optional include filter
          # --------------------------------------------------------

          if (-not [string]::IsNullOrWhiteSpace($include)) {

            $args += '--include'
            $args += $include
          }

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'STALKER 2 PAK EXTRACTION'
          Write-Host '========================================'
          Write-Host "PAK:     $pak"
          Write-Host "Output:  $output"
          Write-Host "Include: $include"
          Write-Host "AES:     $useKey"
          Write-Host ''

          # Never print the AES key.

          & $env:REPAK_EXE @args 2>&1 |
            Tee-Object `
              -FilePath (Join-Path $output 'logs\repak-unpack.log')

          if ($LASTEXITCODE -ne 0) {
            throw `
              "repak unpack failed with exit code $LASTEXITCODE."
          }

      # ============================================================
      # GENERATE MANIFEST
      # ============================================================

      - name: Generate manifest
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Join-Path `
            $env:EXTRACT_OUTPUT `
            'manifest.txt'

          @(
            'S.T.A.L.K.E.R. 2 - Repository PAK Extraction'
            '================================================'
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "Workflow run: $env:GITHUB_RUN_ID"
            "PAK: ${{ inputs.pak_path }}"
            "Include: ${{ inputs.include }}"
            "AES key used: ${{ inputs.use_aes_key }}"
            ''
            'Extracted files:'
            '------------------------------------------------'
          ) |
            Set-Content `
              -LiteralPath $manifest `
              -Encoding utf8

          Get-ChildItem `
            -LiteralPath $env:EXTRACT_OUTPUT `
            -File `
            -Recurse |
            ForEach-Object {
              $_.FullName.Substring(
                $env:EXTRACT_OUTPUT.Length + 1
              )
            } |
            Sort-Object |
            Add-Content `
              -LiteralPath $manifest `
              -Encoding utf8

          $files = @(
            Get-ChildItem `
              -LiteralPath $env:EXTRACT_OUTPUT `
              -File `
              -Recurse
          )

          $bytes = (
            $files |
            Measure-Object `
              -Property Length `
              -Sum
          ).Sum

          "File count: $($files.Count)" |
            Add-Content `
              -LiteralPath $manifest `
              -Encoding utf8

          "Total bytes: $bytes" |
            Add-Content `
              -LiteralPath $manifest `
              -Encoding utf8

          Write-Host "Extracted files: $($files.Count)"
          Write-Host "Extracted bytes: $bytes"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: stalker2-pak-extraction-${{ github.run_id }}
          path: ${{ env.EXTRACT_OUTPUT }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Workflow summary
        run: |
          @"
          ## S.T.A.L.K.E.R. 2 PAK Extraction

          **PAK:** `${{ inputs.pak_path }}`

          **Include:** `${{ inputs.include }}`

          **AES key:** `${{ inputs.use_aes_key }}`

          **repak:** v0.2.3

          The repository PAK was inspected and extracted with repak.

          The extracted files are available as the workflow artifact.
          "@ >> $env:GITHUB_STEP_SUMMARY
