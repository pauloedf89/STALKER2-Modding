// DLC1 NPC prototypes are fully expanded copies, so they redefine the fields the
// GameData GeneralNPCObjPrototypes patch changes. Each one is patched here individually.
DLC1NPCBasePatch : struct.begin
   MinDialogInteractDistance = 30
   MaxDialogInteractDistance = 180
   ArmorDifferenceCoefProjectiles = 1.5
   ArmorDifferenceCoefMeleeAttacks = 1.0
   BoneDamageCoefficients : struct.begin
      [0] : struct.begin
         DamageBone = EDamageBone::Head
         DamageCoef = 4.0
      struct.end
      [1] : struct.begin
         DamageBone = EDamageBone::Body
         DamageCoef = 1.0
      struct.end
      [2] : struct.begin
         DamageBone = EDamageBone::Limbs
         DamageCoef = 0.5
      struct.end
   struct.end
   CriticalDamageThreshold = 40
   CriticalDamageCooldownMin = 3
struct.end

DLC1NPCBasePatchZombie : struct.begin
   ArmorDifferenceCoefProjectiles = 1.5
   ArmorDifferenceCoefMeleeAttacks = 1.0
   ZombieBehaviourParameters : struct.begin
      WeaponHandlingOverride : struct.begin
         MinFireCountQueueScaler = 0.5
         MaxFireCountQueueScaler = 0.5
         FarFireQueueDelaySeconds = 2.0
         NearFireQueueDelaySeconds = 3.0
         SwitchWeaponIfNoAmmo = false
      struct.end
      CombatBehaviour : struct.begin
         MinShootingStationaryDistance = 400
         MaxShootingStationaryDistance = 2000
         AddedShootingDistanceOnTheGo = 2000
         MaxShootingAngle = 20
      struct.end
      ZombieAllowedEquipItems : struct.begin
         // whitelist weapons for zombies
         GunKora_HG = ERank::Newbie, ERank::Experienced, ERank::Veteran, ERank::Master
         GunBucket_PP = ERank::Newbie, ERank::Experienced, ERank::Veteran, ERank::Master
         GunObrez_SG = ERank::Newbie, ERank::Experienced, ERank::Veteran, ERank::Master
         GunTOZ_SG = ERank::Newbie, ERank::Experienced, ERank::Veteran, ERank::Master
         GunViper_PP = ERank::Experienced, ERank::Veteran, ERank::Master
         GunFora230_PP = ERank::Experienced, ERank::Veteran, ERank::Master
         GunThreeLine_SP = ERank::Experienced, ERank::Veteran, ERank::Master
         GunAKU_PP = ERank::Veteran, ERank::Master
         GunLavina_ST = ERank::Veteran, ERank::Master
      struct.end
   struct.end
struct.end


