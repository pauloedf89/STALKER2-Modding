// Shared trade discount tables, referenced via refkey by the prototypes below.
DLC1TradeDiscounts_Patch : struct.begin
   BuyDiscounts : struct.begin
      [*] : struct.begin
         ConditionSID = PlayerRankExperienced
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankVeteran
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankMaster
         Modifier = 1.0f
      struct.end
   struct.end
   SellDiscounts : struct.begin
      [*] : struct.begin
         ConditionSID = PlayerRankExperienced
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankVeteran
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankMaster
         Modifier = 1.0f
      struct.end
   struct.end
struct.end
GarpunTrader_TradePrototype : struct.begin {bpatch; refkey=DLC1TradeDiscounts_Patch}
   RefreshConditionSID = TradeRegenDaysPassed1
   TradeGenerators : struct.begin
      [*] : struct.begin
         ConditionSID = ConstTrue
         ItemGeneratorPrototypeSID = GarpunTrader_TradeItemGenerator
         BuyModifier = 0.3334f
         SellModifier = 1.f
         WeaponSellMinDurability = 0.4f
         ArmorSellMinDurability = 0.4f
         BuyLimitations : struct.begin
            [*] = EItemType::Weapon
            [*] = EItemType::Armor
            [*] = EItemType::Consumable
         struct.end
      struct.end
   struct.end
struct.end
