// Shared trade discount tables, referenced via refkey by the prototypes below.
TradeDiscounts_Patch : struct.begin
   BuyDiscounts : struct.begin
      [*] : struct.begin
         ConditionSID = PlayerRankExperienced
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankVeteran
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankMaster
         Modifier = 1.0f
      struct.end
   struct.end
   SellDiscounts : struct.begin
      [*] : struct.begin
         ConditionSID = PlayerRankExperienced
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankVeteran
         Modifier = 1.0f
      struct.end
      [*] : struct.begin
         ConditionSID = PlayerRankMaster
         Modifier = 1.0f
      struct.end
   struct.end
struct.end
