TemplatePlayerPistolPatch : struct.begin
   BulletDropLength = 50000.0 // length of bullet ark, 500m for all weapons
   BulletDropHeight = 1000.0 // height of bullet ark, individually calculated for each weapon
   DistanceDropOffLength = 50000.0 // length of DAMAGE distance drop off, 500m for all weapons, no impact on trajectory
   NPCToNPCDamageScaler = 0.5
   DurabilityDamagePerShot = 3.0
   EffectiveFireDistanceMin = 1500.0 // zero range of a weapon, bullet drop doesn't start up until this range, grouped by weapon category; 1500 = 15m
   EffectiveFireDistanceMax = 1500.0
   FireDistanceDropOff = 100.0 // damage doesn't start to drop off until this range; damage should start to drop off almost immidiately for all weapons; 100 = 1m
   FireDistanceDispersion = 10000 // DispersionRadius at this range (100m), individually calculated for each weapon
   DispersionRadius = 100 // hip fire and NPC dispersion at FireDistanceDispersion range, 100 = 1m radius of spread at 100m; ADS dispersion is individually calculated for each weapon to be close to MOA, set in WeaponGeneralSetupPrototypes with AimModifier multiplier
   MinBulletDistanceDamageModifier = 1.0 // damage at DistanceDropOffLength (500m) aka damage drop off, 0.1 = 10% of damage
   MinBulletDistanceArmorPiercingModifier = 1.0 // armor piercing at DistanceDropOffLength (500m), 0.1 = 10% of AP
   RangeUI = 0.15
struct.end
